name: Build APK

on:
  push:
    branches: [main]
    # ページや説明文だけの変更ではアプリを作り直さない
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          fi
          gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk nightlock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nightlock-apk
          path: nightlock.apk

      # スマホから落とせるよう、Releases の「latest」に最新の APK を置き直す
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nightlock.apk \
            --title "最新版" \
            --notes "スマホでこのページを開き、nightlock.apk をダウンロードしてインストールしてください。"
